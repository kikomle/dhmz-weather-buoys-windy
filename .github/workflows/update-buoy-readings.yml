name: Update buoy wave readings

on:
    push:
        branches: [main]
    schedule:
        - cron: '*/10 * * * *'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: requirements-reader.txt
            - name: Install chart reader
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes tesseract-ocr
                  python -m pip install --requirement requirements-reader.txt
            - name: Read latest wave heights from DHMZ charts
              run: python scripts/update_buoy_readings.py --output docs/buoy-readings.json
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: docs

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
